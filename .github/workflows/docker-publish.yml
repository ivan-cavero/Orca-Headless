name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The Orca release baked into the image. Bump this to ship a new Orca.
  ORCA_VERSION: v1.4.206

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute lowercase image name
        # GHCR rejects uppercase repository names; github.repository preserves case.
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        # Must come before buildx: it registers the emulators for arm64 builds.
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 only on real publishes: QEMU plus apt is slow on every PR.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ORCA_VERSION=${{ env.ORCA_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke test the image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for the runner's platform
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: orca-headless:smoke
          build-args: |
            ORCA_VERSION=${{ env.ORCA_VERSION }}
          cache-from: type=gha

      - name: Start the container
        run: |
          docker run -d --name orca-smoke \
            --init \
            -e ORCA_PORT=6768 \
            -e ORCA_PAIRING_ADDRESS=127.0.0.1 \
            -e ORCA_NO_SANDBOX=true \
            -p 6768:6768 \
            orca-headless:smoke

      - name: Wait for the readiness contract
        run: |
          for attempt in $(seq 1 60); do
            if docker exec orca-smoke /usr/local/bin/orca-healthcheck; then
              echo "::notice::Orca reported readiness after ${attempt} probe(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Orca never reported readiness within 300s"
          exit 1

      - name: Report container state
        if: always()
        run: |
          docker inspect --format 'health={{.State.Health.Status}} status={{.State.Status}}' orca-smoke || true
          docker logs orca-smoke 2>&1 | tail -50 || true

      - name: Cleanup
        if: always()
        run: docker rm -f orca-smoke || true
