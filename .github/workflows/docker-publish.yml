name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The Orca release baked into the image. Bump this to ship a new Orca.
  ORCA_VERSION: v1.4.210

jobs:
  lint:
    name: Lint scripts and compose files
    # Pinned rather than `-latest`: the label is scheduled to move to Ubuntu 26,
    # and a runner image change should be a deliberate commit.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell syntax
        # A missing `)` in a case pattern shipped once; this catches it.
        run: |
          bash -n entrypoint.sh
          for script in scripts/*.sh; do sh -n "$script"; done

      - name: ShellCheck
        run: shellcheck -S warning entrypoint.sh scripts/*.sh

      - name: Check documentation links
        # Relative links and #anchors must resolve; a docs refactor once left
        # several pointing at sections that had been renamed.
        run: python3 scripts/check-links.py

      - name: Warn if a newer Orca has been released
        # The pinned Orca version goes stale silently, and the image then ships
        # an old build with no signal. This is a warning, not a failure: bumping
        # is a deliberate commit that has to be verified, not something CI
        # should force on every run.
        run: |
          latest=$(curl -fsSL -H 'User-Agent: Mozilla/5.0' \
            https://github.com/stablyai/orca/releases.atom \
            | grep -oE '<title>v[0-9]+\.[0-9]+\.[0-9]+</title>' \
            | head -1 | sed -E 's|</?title>||g')
          echo "pinned: ${ORCA_VERSION}  latest: ${latest:-unknown}"
          if [ -n "${latest}" ] && [ "${latest}" != "${ORCA_VERSION}" ]; then
            echo "::warning title=Orca version is behind::Pinned ${ORCA_VERSION} but ${latest} has been released. Bump ORCA_VERSION in the Dockerfile, .env.example, docker-compose.build.yml and this workflow, then verify the container still reaches healthy."
          fi

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.build.yml config >/dev/null

      - name: Assert ORCA_HOME_DIR produces an identity mount
        # Parse the resolved config as JSON instead of grepping its text. Docker
        # Compose normalizes short-form volumes to long form, so a text match on
        # "src:dst" passes with one renderer and silently fails with the other —
        # which is exactly how this step first broke.
        run: |
          out=$(ORCA_HOME_DIR=/srv/orca/home docker compose -f docker-compose.yml config --format json)
          if ! echo "$out" | jq -e '.services.orca.environment.HOME == "/srv/orca/home"'; then
            echo "::error::HOME is not the configured ORCA_HOME_DIR"; echo "$out" | jq .; exit 1
          fi
          if ! echo "$out" | jq -e '[.services.orca.volumes[] | select(.source == "/srv/orca/home" and .target == "/srv/orca/home")] | length == 1'; then
            echo "::error::the mount is not an identity bind of ORCA_HOME_DIR"; echo "$out" | jq .; exit 1
          fi

      - name: Assert the default needs no host directory
        run: |
          out=$(docker compose -f docker-compose.yml config --format json)
          if ! echo "$out" | jq -e '.services.orca.environment.HOME == "/home/orca"'; then
            echo "::error::HOME is not the image default"; echo "$out" | jq .; exit 1
          fi
          if ! echo "$out" | jq -e '[.services.orca.volumes[] | select(.source == "orca-home" and .target == "/home/orca")] | length == 1'; then
            echo "::error::the default is not a named volume at /home/orca"; echo "$out" | jq .; exit 1
          fi

  build:
    # Builds the multi-arch image and publishes it under an immutable sha tag.
    # The release tags (latest, the branch, semver) are added later, by the
    # publish job, and only after the smoke test has run the image. Publishing
    # latest here would mean a broken image is already live while it is being
    # verified.
    name: Build and push (sha)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute lowercase image name
        # GHCR rejects uppercase repository names; github.repository preserves case.
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        # Must come before buildx: it registers the emulators for the arm64 leg.
        # Only the runtime stage needs emulation — the AppImage is extracted on
        # the build platform, which is why this is affordable.
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push under an immutable tag
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            ORCA_VERSION=${{ env.ORCA_VERSION }}
          # A named scope of its own. Three jobs exporting to the default scope
          # thrash each other's entries, which is why the arm64 smoke job came
          # back 0% cached and spent 4m49s rebuilding layers that already existed.
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build

  smoke-test:
    # Runs the image for real, on a NATIVE runner for each architecture. The
    # arm64 leg is the one that matters for a Raspberry Pi: building an arm64
    # image proves nothing about whether it starts.
    #
    # On a push it pulls the image the build job just published, so what is
    # verified is the artifact that will be promoted — not a local rebuild that
    # happens to match it. On a pull request nothing is published, so it builds.
    name: Smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Depends on build, but must still run when build is skipped (pull requests),
    # which is why the condition is spelled out instead of relying on the default
    # "all needs succeeded" rule — a skipped need would skip this job too.
    needs: [lint, build]
    if: |
      always() && !cancelled()
      && needs.lint.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # Sequential: two jobs exporting to the same GHA cache scope at the same
      # time can conflict.
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image
        if: github.event_name != 'pull_request'
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          docker pull --platform "linux/${{ matrix.arch }}" "$image"
          docker tag "$image" orca-headless:smoke

      - name: Build locally for this runner's architecture
        # Pull requests only: nothing has been published to pull.
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: orca-headless:smoke
          build-args: |
            ORCA_VERSION=${{ env.ORCA_VERSION }}
          cache-from: |
            type=gha,scope=build
            type=gha,scope=smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.arch }}

      - name: Assert we really are on ${{ matrix.arch }}
        # Without this the whole job could silently be testing the wrong
        # architecture and still pass.
        run: |
          echo "runner: $(uname -m)"
          image_arch=$(docker image inspect orca-headless:smoke --format '{{.Architecture}}')
          echo "image architecture: ${image_arch}"
          test "${image_arch}" = "${{ matrix.arch }}"

      - name: Start the container
        run: |
          docker run -d --name orca-smoke \
            --init \
            -e ORCA_PORT=6768 \
            -e ORCA_PAIRING_ADDRESS=127.0.0.1 \
            -e ORCA_NO_SANDBOX=true \
            -p 6768:6768 \
            -v orca-smoke-home:/home/orca \
            orca-headless:smoke

      - name: Wait for the readiness contract
        run: |
          for attempt in $(seq 1 60); do
            if docker exec orca-smoke /usr/local/bin/orca-healthcheck; then
              echo "::notice::Orca reported readiness after ${attempt} probe(s) on ${{ matrix.arch }}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Orca never reported readiness within 300s on ${{ matrix.arch }}"
          exit 1

      - name: Verify the CLI resolves and the port serves the web client
        run: |
          docker exec orca-smoke orca-ide --version
          curl -fsS http://127.0.0.1:6768/web-index.html | grep -qi '<title>Orca Web</title>'

      - name: Verify the pairing link is retrievable
        # If this breaks, nobody can pair a client — the log is the only source
        # of the link, since there is no CLI command to mint one.
        run: |
          docker exec orca-smoke orca-pairing-url
          docker exec orca-smoke orca-pairing-url | grep -q 'orca://pair?code='

      - name: Verify the bundled skills print offline
        # These ship inside the image and are what tells an agent how to drive
        # Orca; if they stop resolving, agents inside the container go blind.
        run: |
          docker exec orca-smoke orca-ide skills get orchestration | head -5
          test "$(docker exec orca-smoke orca-ide skills get orchestration | wc -l)" -gt 100

      - name: Verify a worktree lands in the persisted home
        # Orca creates checkouts under $HOME/orca/workspaces, not under the repo
        # it imports. If that path is not inside the mounted volume, every
        # checkout dies with the container while the metadata survives and points
        # at nothing.
        run: |
          docker exec orca-smoke sh -c '
            set -e
            mkdir -p "$HOME/projects/demo"
            cd "$HOME/projects/demo"
            git init -q -b main
            git remote add origin https://github.com/example/demo.git
            git -c user.email=t@t.t -c user.name=t commit -q --allow-empty -m init
            orca-ide repo add --path "$HOME/projects/demo" --json >/dev/null
            orca-ide worktree create --repo "path:$HOME/projects/demo" --name ci-wt --json >/dev/null
            test -d "$HOME/orca/workspaces/demo/ci-wt"
            echo MARKER > "$HOME/orca/workspaces/demo/ci-wt/UNCOMMITTED.txt"
          '

      - name: Recreate the container and verify the worktree survives
        run: |
          docker rm -f orca-smoke
          docker run -d --name orca-smoke \
            --init \
            -e ORCA_PORT=6768 -e ORCA_PAIRING_ADDRESS=127.0.0.1 -e ORCA_NO_SANDBOX=true \
            -p 6768:6768 \
            -v orca-smoke-home:/home/orca \
            orca-headless:smoke
          for attempt in $(seq 1 60); do
            docker exec orca-smoke /usr/local/bin/orca-healthcheck >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec orca-smoke cat /home/orca/orca/workspaces/demo/ci-wt/UNCOMMITTED.txt
          docker exec orca-smoke sh -c 'orca-ide worktree list --json | grep -q ci-wt'

      - name: Report container state
        if: always()
        run: |
          docker inspect --format 'health={{.State.Health.Status}} status={{.State.Status}}' orca-smoke || true
          docker logs orca-smoke 2>&1 | tail -50 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f orca-smoke || true
          docker volume rm -f orca-smoke-home || true

  scan:
    # Reports what is in the published image. Deliberately non-blocking: the
    # image carries ~470 MB of distribution packages, most findings have no fix
    # available, and failing here would block every build on something nobody can
    # act on. Findings land in the repository's Security tab, where they can be
    # triaged like any other alert.
    name: Scan for vulnerabilities
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload findings to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  publish:
    # The release tags are added here and nowhere else, so an image only becomes
    # `latest` after the smoke test has actually run it on both architectures.
    name: Promote verified image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: smoke-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Stage the release tags
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '%s\n' "$RELEASE_TAGS" > /tmp/release-tags.txt

      - name: Retag the verified multi-arch manifest
        # `imagetools create` points a new tag at the existing manifest list. It
        # does not rebuild anything, so the bytes that were smoke tested are the
        # bytes that ship.
        run: |
          set -euo pipefail
          source="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "verified source manifest:"
          docker buildx imagetools inspect "$source"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "promoting -> ${tag}"
            docker buildx imagetools create --tag "$tag" "$source"
          done < /tmp/release-tags.txt
          echo "done. published tags:"
          cat /tmp/release-tags.txt
