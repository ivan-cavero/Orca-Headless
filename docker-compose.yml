# Orca Headless Docker — the deployment file.
#
#   cp .env.example .env      # then edit ORCA_PAIRING_ADDRESS
#   docker compose up -d
#
# That is the whole setup. No host directory, no extra overlay, no mkdir.
#
# Everything Orca owns — its state, its worktree checkouts and the repositories
# you import — lives in ONE volume mounted at /home/orca.
#
# Full documentation: README.md

services:
  orca:
    image: ${ORCA_IMAGE:-ghcr.io/ivan-cavero/orca-headless:latest}
    container_name: orca

    restart: unless-stopped
    # Reap the zombie processes Electron leaves behind and forward SIGTERM.
    init: true
    # Orca owns its Xvfb child; give it room to shut down cleanly.
    stop_grace_period: 30s

    # Must match the image's build-time PUID/PGID, otherwise the volume is owned
    # by a different uid and Orca cannot persist anything. See the README.
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      # host:container. Keep ORCA_HOST_PORT in sync with this mapping: the
      # entrypoint uses it to build the advertised pairing URL, so a mismatch
      # here would hand clients an address nothing is listening on.
      - "${ORCA_HOST_PORT:-6768}:${ORCA_PORT:-6768}"

    environment:
      # Where Orca keeps everything. Leave unset to use the image's own home
      # (/home/orca, backed by the volume below).
      #
      # Set it to an ABSOLUTE HOST PATH to turn the volume into a real host
      # directory mounted at its own path — the container then sees exactly the
      # layout a native Orca install would, and plain `git worktree list` on the
      # host agrees with Orca. Example: ORCA_HOME_DIR=/srv/orca/home
      #
      # Do NOT set it to a relative path, and on Dokploy leave it unset (Dokploy
      # cleans up absolute host paths between deployments).
      HOME: "${ORCA_HOME_DIR:-/home/orca}"

      # Port Orca listens on inside the container.
      ORCA_PORT: "${ORCA_PORT:-6768}"
      # Port published on the host. Defaults to ORCA_PORT; only set it when the
      # mapping above publishes a different host port.
      ORCA_HOST_PORT: "${ORCA_HOST_PORT:-6768}"
      # Address clients dial. NOT the bind address. Must be reachable from the
      # client: the host's LAN IP, DNS name, Tailscale address, or a full
      # reverse-proxy URL such as https://orca.example.com/runtime.
      ORCA_PAIRING_ADDRESS: "${ORCA_PAIRING_ADDRESS:-127.0.0.1}"
      # Emit the versioned single-line JSON readiness contract (recommended).
      ORCA_JSON: "${ORCA_JSON:-true}"
      # Chromium's sandbox cannot work in a default container; see the README
      # section "About --no-sandbox" before flipping this to false.
      ORCA_NO_SANDBOX: "${ORCA_NO_SANDBOX:-true}"
      # Extra flags appended verbatim to `orca serve`, e.g. --mobile-pairing.
      ORCA_EXTRA_ARGS: "${ORCA_EXTRA_ARGS:-}"

    volumes:
      # One volume, everything Orca owns: ~/.config (state, pairing keys),
      # ~/orca/workspaces (worktree checkouts) and ~/projects (your repos).
      #
      # Leave ORCA_HOME_DIR unset and this is a named Docker volume: zero host
      # setup, and Dokploy's Volume Backups can snapshot it.
      #
      # Set ORCA_HOME_DIR=/srv/orca/home and this becomes a bind mount of that
      # directory onto itself, so host paths and container paths are identical.
      # Create it first and own it:  sudo mkdir -p /srv/orca/home && sudo chown -R "$(id -u):$(id -g)" /srv/orca/home
      #
      # On an SELinux host (Fedora, RHEL, CentOS) also set ORCA_SELINUX_LABEL=:z,
      # or the label blocks writes even though Unix permissions look correct.
      - ${ORCA_HOME_DIR:-orca-home}:${ORCA_HOME_DIR:-/home/orca}${ORCA_SELINUX_LABEL:-}

      # Optional: keep repositories outside the volume, on their own host path.
      # Only meaningful while ORCA_HOME_DIR is unset, because it targets
      # /home/orca/projects. Add it back if you want your repos somewhere you
      # can reach directly:
      #   - /srv/repos:/home/orca/projects
      # On a rootless runtime this bind mount needs `userns_mode: keep-id` added
      # to this service; the named volume above does not. See the README.

    # Mirrors the HEALTHCHECK baked into the image; uncomment to tune it here.
    healthcheck:
      test: ["CMD", "/usr/local/bin/orca-healthcheck"]
      interval: 15s
      timeout: 10s
      # First boot may migrate persisted state, so allow a generous warm-up.
      # Failures during start_period do not count towards retries.
      start_period: 90s
      retries: 3

    # Hardening. Both options are compatible with ORCA_NO_SANDBOX=true.
    # If you set ORCA_NO_SANDBOX=false you must drop both of these and add
    # `cap_add: [SYS_ADMIN]` instead — see the README.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  orca-home:
